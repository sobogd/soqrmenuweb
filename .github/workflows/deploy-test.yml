name: Deploy to Test (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install local dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPS_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: ".next/,package.json,package-lock.json,public/,prisma/"
          target: "/home/deploy/apps/iq-rest-test"
          overwrite: true

      - name: Setup and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:/home/deployer/.npm-global/bin

            cd /home/deploy/apps/iq-rest-test

            cat > .env <<EOF
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            SMTP_HOST="${{ secrets.SMTP_HOST }}"
            SMTP_PORT="${{ secrets.SMTP_PORT }}"
            SMTP_USER="${{ secrets.SMTP_USER }}"
            SMTP_PASS="${{ secrets.SMTP_PASS }}"
            FROM_EMAIL="${{ secrets.FROM_EMAIL }}"
            TO_EMAIL="${{ secrets.TO_EMAIL }}"
            S3_HOST="${{ secrets.S3_HOST }}"
            S3_KEY="${{ secrets.S3_KEY }}"
            S3_NAME="${{ secrets.S3_NAME }}"
            S3_REGION="${{ secrets.S3_REGION }}"
            S3_TOKEN="${{ secrets.S3_TOKEN }}"
            NEXT_PUBLIC_MAPS_API_KEY="${{ secrets.NEXT_PUBLIC_MAPS_API_KEY }}"
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            GOOGLE_ADS_CLIENT_ID="${{ secrets.GOOGLE_ADS_CLIENT_ID }}"
            GOOGLE_ADS_CLIENT_SECRET="${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}"
            GOOGLE_ADS_REFRESH_TOKEN="${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}"
            GOOGLE_ADS_CUSTOMER_ID="${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}"
            GOOGLE_ADS_DEVELOPER_TOKEN="${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}"
            GOOGLE_ADS_CONVERSION_ACTION_ID="${{ secrets.GOOGLE_ADS_CONVERSION_ACTION_ID }}"
            GOOGLE_ADS_CONVERSION_ACTION_ID_VIEWS="${{ secrets.GOOGLE_ADS_CONVERSION_ACTION_ID_VIEWS }}"
            GOOGLE_ADS_CONVERSION_ACTION_ID_SUBSCRIPTION="${{ secrets.GOOGLE_ADS_CONVERSION_ACTION_ID_SUBSCRIPTION }}"
            GOOGLE_ADS_LOGIN_CUSTOMER_ID="${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}"
            TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}"
            PORT=9000
            EOF

            npm ci --production

            npx prisma migrate deploy
            npx prisma generate

            pm2 restart iq-rest-test --update-env || pm2 start npm --name "iq-rest-test" -- start -- -p 9000

            pm2 save
